<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Policy 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  perfectsensed runs as root and owns the name. Desktop users may call methods
  and set properties; the daemon enforces hardware/sysfs access.
-->
<busconfig>
  <policy user="root">
    <allow own="org.perfectsense.Sense1"/>
    <allow send_destination="org.perfectsense.Sense1"/>
    <allow receive_sender="org.perfectsense.Sense1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.perfectsense.Sense1"/>
    <allow send_interface="org.perfectsense.Sense1"/>
    <allow send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_type="method_call" send_destination="org.perfectsense.Sense1"/>
    <allow receive_sender="org.perfectsense.Sense1"/>
    <allow receive_type="signal" receive_sender="org.perfectsense.Sense1"/>
  </policy>
</busconfig>
